# Конфигурация для одного домена (без поддоменов)
# Используйте эту конфигурацию, если не хотите использовать поддомены
# Скопируйте этот файл в /etc/nginx/sites-available/yourdomain.ru
# И замените yourdomain.ru на ваш домен

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name yourdomain.ru www.yourdomain.ru;
    return 301 https://$server_name$request_uri;
}

# Основной сервер
server {
    listen 443 ssl http2;
    server_name yourdomain.ru www.yourdomain.ru;
    
    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.ru/privkey.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Корневая директория для фронтенда
    root /var/www/yourdomain.ru/dist;
    index index.html;
    
    # Логи
    access_log /var/log/nginx/yourdomain.ru.access.log;
    error_log /var/log/nginx/yourdomain.ru.error.log;
    
    # API прокси (Flask на порту 5001)
    location /api {
        proxy_pass http://localhost:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Strapi CMS прокси (порт 1337)
    location /cms {
        proxy_pass http://localhost:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Frontend (React)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Увеличение размера загружаемых файлов
    client_max_body_size 50M;
    
    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

