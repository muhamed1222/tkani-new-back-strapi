# Frontend конфигурация для Nginx
# Скопируйте этот файл в /etc/nginx/sites-available/yourdomain.ru
# И замените yourdomain.ru на ваш домен

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name yourdomain.ru www.yourdomain.ru;
    return 301 https://$server_name$request_uri;
}

# Frontend (React)
server {
    listen 443 ssl http2;
    server_name yourdomain.ru www.yourdomain.ru;
    
    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.ru/privkey.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Корневая директория (путь к собранному фронтенду)
    root /var/www/yourdomain.ru/dist;
    index index.html;
    
    # Логи
    access_log /var/log/nginx/yourdomain.ru.access.log;
    error_log /var/log/nginx/yourdomain.ru.error.log;
    
    # Основная конфигурация
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

