# Strapi CMS конфигурация для cms.centertkani.ru
# Скопируйте этот файл в /etc/nginx/sites-available/cms.centertkani.ru

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name cms.centertkani.ru;
    return 301 https://$server_name$request_uri;
}

# Strapi CMS
server {
    listen 443 ssl http2;
    server_name cms.centertkani.ru;
    
    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/cms.centertkani.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.centertkani.ru/privkey.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Логи
    access_log /var/log/nginx/cms.centertkani.ru.access.log;
    error_log /var/log/nginx/cms.centertkani.ru.error.log;
    
    # Проксирование на Strapi (порт 1337)
    location / {
        proxy_pass http://localhost:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket поддержка (для Strapi)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Увеличение размера загружаемых файлов
    client_max_body_size 50M;
    
    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

