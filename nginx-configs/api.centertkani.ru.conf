# Backend API конфигурация для api.centertkani.ru
# Скопируйте этот файл в /etc/nginx/sites-available/api.centertkani.ru

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name api.centertkani.ru;
    return 301 https://$server_name$request_uri;
}

# Backend API (Flask)
server {
    listen 443 ssl http2;
    server_name api.centertkani.ru;
    
    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.centertkani.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.centertkani.ru/privkey.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Логи
    access_log /var/log/nginx/api.centertkani.ru.access.log;
    error_log /var/log/nginx/api.centertkani.ru.error.log;
    
    # Проксирование на Flask (порт 5001)
    location / {
        proxy_pass http://localhost:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Увеличение размера загружаемых файлов
    client_max_body_size 10M;
    
    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

